name: Java CI with Gradle

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Flatpak & Flatpak Builder
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build and Test with Gradle Wrapper
      run: ./gradlew build

    - name: Package Flatpak
      run: |
        mkdir -p packages
        cp build/libs/filebot.jar packages/
        ./flatpak/build-flatpak.sh || {
          echo "Fallback: archiving flatpak manifest and source files"
          mkdir -p packages/flatpak
          cp -r flatpak/* packages/flatpak/
        }

    - name: Upload Package Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: filebot-packages
        path: |
          packages/
          build/libs/filebot.jar
