name: Build & Release Flatpak

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  flatpak-builder:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and upload asset files
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.d03j.filebot-j21.flatpak
          manifest-path: packaging/io.github.d03j.filebot-j21.yaml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: io.github.d03j.filebot-j21.flatpak
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
