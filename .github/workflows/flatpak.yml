name: Flatpak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  flatpak-builder:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.d03j.filebot-j21.flatpak
          manifest-path: packaging/io.github.d03j.filebot-j21.yaml
          cache-key: flatpak-builder-${{ github.sha }}
